[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.1.0"
description = "Transparent multi-asset portfolio risk and fixed-income analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "PyYAML>=6,<7", "streamlit>=1.40,<2", "plotly>=5.20,<7", "matplotlib>=3.8,<4", "requests>=2.31,<3", "openpyxl>=3.1,<4", "XlsxWriter>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
